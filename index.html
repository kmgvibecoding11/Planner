<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a47e0">
<title>Единый план</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Единый план. Раскладка: боковая навигация + рабочая область; на телефоне нижняя навигация.
   Цвет несут цели (g1–g6), интерфейс нейтральный. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eceef3; --line:#dcdfe8; --line-2:#c9cddb;
  --fg:#14182a; --fg-2:#4a5068; --fg-3:#7b8199;
  --accent:#3a47e0; --accent-fg:#ffffff; --accent-soft:#e6e8fd;
  --g1:#2f6bff; --g2:#e8590c; --g3:#12a37f; --g4:#b13fd1; --g5:#c48a00; --g6:#d6336c;
  --ok:#12a37f; --warn:#d98a00; --bad:#d6334a;
  --shadow:0 8px 30px rgba(20,24,42,.14);
  --f-display:"Geologica","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#161a2e; --surface-2:#1e2340; --line:#2a3050; --line-2:#3a4168;
  --fg:#eceef8; --fg-2:#aab0cc; --fg-3:#7c83a3;
  --accent:#8b95ff; --accent-fg:#10142b; --accent-soft:#232a5a;
  --g1:#5d8cff; --g2:#ff8a4c; --g3:#2fd1a6; --g4:#d680f0; --g5:#f0b53a; --g6:#ff6b9d;
  --ok:#2fd1a6; --warn:#f0b53a; --bad:#ff6b82; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2e; --surface-2:#1e2340; --line:#2a3050; --line-2:#3a4168;
  --fg:#eceef8; --fg-2:#aab0cc; --fg-3:#7c83a3;
  --accent:#8b95ff; --accent-fg:#10142b; --accent-soft:#232a5a;
  --g1:#5d8cff; --g2:#ff8a4c; --g3:#2fd1a6; --g4:#d680f0; --g5:#f0b53a; --g6:#ff6b9d;
  --ok:#2fd1a6; --warn:#f0b53a; --bad:#ff6b82; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.2}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:var(--f-mono)}
.muted{color:var(--fg-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:16px 12px;gap:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;padding:2px 8px}
.logo{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
.logo i{width:9px;height:9px;border-radius:3px;display:block}
.proj{padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:.82rem}
.proj b{display:block;font-family:var(--f-display);font-size:.9rem}
.nav{display:grid;gap:2px}
.nav button,.goal-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg-2);text-align:left;width:100%;transition:background .15s var(--ease)}
.nav button:hover,.goal-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--fg-3)}
.sec-t{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-3);padding:0 10px;margin-bottom:2px}
.goal-btn .sw{width:10px;height:10px;border-radius:3px;background:var(--gc);flex:none}
.goal-btn.on{background:var(--surface-2);color:var(--fg);font-weight:600}
.goal-btn span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-foot{margin-top:auto;display:grid;gap:8px}
.field-s{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:8px;padding:7px 9px}
.kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--fg-3)}
.content{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.top h1{font-size:1.25rem;font-weight:700;margin-right:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.filters input,.filters select{background:var(--surface-2);border:1px solid transparent;border-radius:8px;padding:6px 10px;min-width:0;max-width:170px}
.filters input[type=search]{width:170px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{padding:4px 12px;border-radius:6px;color:var(--fg-2);font-size:.85rem}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;background:var(--surface-2);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn.ghost{background:transparent;border:1px solid var(--line-2)}
.ib{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--fg-2)}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.fx-btn{display:none}
#main{flex:1;min-height:0;overflow:auto;padding:16px 20px}
#main.flush{padding:0;overflow:hidden}
.empty{padding:40px 16px;text-align:center;color:var(--fg-3)}
.empty b{display:block;color:var(--fg-2);margin-bottom:4px;font-family:var(--f-display)}

/* common bits */
.av{width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;display:inline-grid;place-items:center;font-size:.64rem;font-weight:600;border:2px solid var(--surface);flex:none}
html[data-theme="dark"] .av{color:#10142b}
.avs{display:inline-flex}.avs .av+.av{margin-left:-7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--fg-3));display:inline-block;flex:none}
.s-backlog{--sc:var(--fg-3)}.s-todo{--sc:var(--g1)}.s-in_progress{--sc:var(--warn)}.s-review{--sc:var(--g4)}.s-done{--sc:var(--ok)}.s-cancelled{--sc:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:.74rem;color:var(--fg-3);min-width:0}
.crumb button{color:var(--fg-3);padding:0 2px;border-radius:3px}
.crumb button:hover{color:var(--accent);text-decoration:underline}
.crumb i{font-style:normal;opacity:.6}
.over{color:var(--bad);font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--gc,var(--accent));border-radius:99px;transition:width .25s var(--ease)}
.pr{display:inline-block;width:14px;height:10px;background:linear-gradient(var(--pc),var(--pc)) 0 100%/3px 40% no-repeat,linear-gradient(var(--pc),var(--pc)) 5px 100%/3px 70% no-repeat,linear-gradient(var(--pc),var(--pc)) 10px 100%/3px 100% no-repeat;opacity:.9}
.p-low{--pc:var(--fg-3)}.p-medium{--pc:var(--g1)}.p-high{--pc:var(--warn)}.p-urgent{--pc:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
select.inl,input.inl{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 5px;max-width:100%}
select.inl:hover,input.inl:hover{border-color:var(--line-2)}
select:disabled,input:disabled,textarea:disabled{opacity:.7;cursor:not-allowed}

/* list */
.lh,.lr{display:grid;grid-template-columns:minmax(220px,1fr) 128px 94px 124px 96px 30px;gap:8px;align-items:center;padding:6px 10px}
.lh{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.lr{border-bottom:1px solid var(--line);min-height:40px}
.lr:hover{background:var(--surface-2)}
.lr.goal{background:var(--surface-2);font-weight:600}
.lr .tt{display:flex;align-items:center;gap:8px;min-width:0}
.lr .tt .sw{width:10px;height:10px;border-radius:3px;background:var(--gc);flex:none}
.lr .tt .nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lr .tt .nm:hover{color:var(--accent)}
.lr .tt .cr{font-size:.72rem;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.caret{width:18px;height:18px;display:grid;place-items:center;color:var(--fg-3);flex:none;border-radius:4px}
.caret:hover{background:var(--line)}
.caret svg{transition:transform .15s var(--ease)}
.caret.open svg{transform:rotate(90deg)}
.lr .add{opacity:0}.lr:hover .add,.lr .add:focus-visible{opacity:1}
.lr .pg{display:flex;align-items:center;gap:6px}.lr .pg .bar{flex:1}.lr .pg span{font-family:var(--f-mono);font-size:.72rem;width:30px;text-align:right}
.inbox-h{margin:18px 0 6px;font-family:var(--f-display);display:flex;gap:8px;align-items:center}

/* mind map */
.mm{position:relative;height:100%;min-height:420px;overflow:hidden;cursor:grab;touch-action:none;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.mm.pan{cursor:grabbing}
.mm-in{position:absolute;left:0;top:0;transform-origin:0 0}
.mm-in svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mm-in path{fill:none;stroke-width:2;opacity:.6}
.mm-n{position:absolute;width:220px;height:46px;background:var(--surface);border:1.5px solid var(--line-2);border-radius:10px;padding:5px 10px 7px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:box-shadow .15s var(--ease),opacity .15s}
.mm-n:hover{box-shadow:var(--shadow)}
.mm-n.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mm-n.dim{opacity:.32}
.mm-n.drop{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 30%,transparent)}
.mm-n.goal{background:var(--gc);border-color:var(--gc);color:#fff}
html[data-theme="dark"] .mm-n.goal{color:#10142b}
.mm-n.root{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-family:var(--f-display);font-weight:700;width:200px}
.mm-n.inbox{border-style:dashed}
.mm-n .l1{display:flex;align-items:center;gap:7px;min-width:0}
.mm-n .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;flex:1;min-width:0}
.mm-n.done .t{text-decoration:line-through;color:var(--fg-3)}
.mm-n .l2{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--fg-3);height:16px}
.mm-n.goal .l2{color:inherit;opacity:.85}
.mm-n .pb{position:absolute;left:8px;right:8px;bottom:2px;height:3px;border-radius:3px;background:rgba(127,127,127,.2);overflow:hidden}
.mm-n .pb i{display:block;height:100%;background:var(--gc,var(--accent))}
.mm-n.goal .pb i{background:#fff}
.mm-n .tg{position:absolute;right:-11px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-2);font-size:.62rem;color:var(--fg-2);display:grid;place-items:center;z-index:2;font-family:var(--f-mono)}
.mm-n .plus{position:absolute;right:-34px;top:50%;margin-top:-11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:none;place-items:center;font-size:1rem;line-height:1;z-index:3}
.mm-n.sel .plus{display:grid}
.mm-n.sel .tg{right:-11px}
.mm.far .l2{display:none}
.mm-tools{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;justify-content:flex-end}
.mm-tools .btn{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.mm-hint{position:absolute;left:14px;bottom:14px;font-size:.74rem;color:var(--fg-3);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;z-index:5;max-width:60%}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-h h2{font-size:1.15rem;min-width:150px;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal-w{padding:6px 8px;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal-d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.cal-d:nth-child(7n){border-right:0}
.cal-g.wk .cal-d{min-height:360px}
.cal-d.out{background:var(--surface-2);opacity:.65}
.cal-d.today .dn{background:var(--accent);color:var(--accent-fg)}
.cal-d.dragover{background:var(--accent-soft)}
.dn{font-size:.74rem;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-family:var(--f-mono);color:var(--fg-2)}
.cal-d .addd{position:absolute;right:4px;top:4px;opacity:0;width:20px;height:20px;border-radius:6px;color:var(--fg-3)}
.cal-d:hover .addd{opacity:1}
.ev{display:flex;align-items:center;gap:5px;font-size:.74rem;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--gc) 18%,var(--surface));color:var(--fg);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;border-left:3px solid var(--gc);min-width:0}
.ev.cont{opacity:.65}
.ev.done{text-decoration:line-through;opacity:.55}
.ev.ddl{background:transparent;border:1px dashed var(--gc);border-left-width:1px}
.ev .tx{overflow:hidden;text-overflow:ellipsis}
.more{font-size:.7rem;color:var(--fg-3);text-align:left;padding:0 6px}
.agenda{display:grid;gap:14px;max-width:720px}
.ag-day h3{font-size:.9rem;margin-bottom:6px;text-transform:capitalize}
.ag-day h3.today{color:var(--accent)}
.undated{margin-top:16px;padding:12px}
.undated h3{font-size:.9rem;margin-bottom:8px}
.undated .row{display:flex;flex-wrap:wrap;gap:6px}

/* gantt */
.g-bar-t{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:calc(100dvh - 190px);position:relative}
.gin{position:relative}
.g-head{display:flex;position:sticky;top:0;z-index:6;background:var(--surface-2);height:46px}
.g-corner{width:268px;flex:none;position:sticky;left:0;z-index:7;background:var(--surface-2);border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 10px;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3)}
.g-scale{position:relative;flex:none;border-bottom:1px solid var(--line)}
.g-scale .m{position:absolute;top:0;height:22px;border-left:1px solid var(--line);padding:3px 6px;font-size:.72rem;font-weight:600;color:var(--fg-2);text-transform:capitalize;white-space:nowrap}
.g-scale .d{position:absolute;top:24px;height:20px;text-align:center;font-family:var(--f-mono);font-size:.64rem;color:var(--fg-3);overflow:hidden}
.g-scale .d.we{color:var(--bad)}
.g-row{display:flex;height:34px;border-bottom:1px solid var(--line)}
.g-label{width:268px;flex:none;position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;min-width:0}
.g-row.goal .g-label{background:var(--surface-2);font-weight:600}
.g-label .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;min-width:0;flex:1}
.g-label .nm:hover{color:var(--accent)}
.g-track{position:relative;flex:none;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--cw) 100%}
.g-bar{position:absolute;top:6px;height:22px;border-radius:6px;background:color-mix(in srgb,var(--gc) 45%,var(--surface));border:1.5px solid var(--gc);cursor:grab;overflow:hidden;touch-action:none;display:flex;align-items:center;user-select:none}
.g-bar .pf{position:absolute;left:0;top:0;bottom:0;background:var(--gc);opacity:.85}
.g-bar .lb{position:relative;font-size:.68rem;padding:0 6px;color:var(--fg);white-space:nowrap;font-weight:500;text-shadow:0 0 3px var(--surface)}
.g-bar .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize}
.g-bar.crit{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.g-bar.late{border-style:dashed;border-color:var(--bad)}
.g-bar.ro{cursor:pointer}
.g-bar.sum{top:11px;height:11px;border-radius:3px;background:var(--gc);border:0;opacity:.75;cursor:default}
.g-bar.sum .pf{background:rgba(0,0,0,.35)}
.g-bar.ms{width:18px!important;height:18px;top:8px;background:var(--gc);border:0;transform:rotate(45deg) scale(.8);border-radius:3px}
.g-bar.ms.crit{background:var(--bad)}
.g-ov{position:absolute;left:268px;top:46px;pointer-events:none;z-index:3}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7;z-index:3}
.g-today::before{content:"сегодня";position:absolute;top:-1px;left:4px;font-family:var(--f-mono);font-size:.62rem;color:var(--bad)}

/* board */
.b-wrap{overflow:auto;padding-bottom:8px}
.b-grid{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:10px;min-width:1190px}
.b-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;padding:4px 4px 6px;position:sticky;top:0}
.b-h .n{font-family:var(--f-mono);font-size:.74rem;color:var(--fg-3);margin-left:auto}
.b-lane{grid-column:1/-1;font-family:var(--f-display);font-weight:700;display:flex;align-items:center;gap:8px;margin-top:10px;padding:4px}
.b-lane .sw{width:10px;height:10px;border-radius:3px;background:var(--gc)}
.b-col{background:var(--surface-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:90px;transition:background .15s}
.b-col.dragover{background:var(--accent-soft);outline:2px dashed var(--accent)}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:grab;width:100%;transition:box-shadow .15s}
.kc:hover{box-shadow:var(--shadow)}
.kc .t{font-weight:500}
.kc .ft{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--fg-3)}
.kc .ft .avs{margin-left:auto}
.kc .cr-w{display:flex;gap:6px;align-items:center}

var kids,byId,calc;
function derive(a){
  var act=a.filter(function(s){return s!=='cancelled'});
  if(!act.length)return a.length?'cancelled':'todo';
  if(act.every(function(s){return s==='done'}))return 'done';
  if(act.some(function(s){return s==='in_progress'||s==='review'||s==='done'}))return 'in_progress';
  if(act.some(function(s){return s==='todo'}))return 'todo';
  return 'backlog';
}
function rebuild(){
  byId={};kids={};calc={};
  S.nodes.forEach(function(n){byId[n.id]=n});
  S.nodes.slice().sort(function(a,b){return a.order-b.order}).forEach(function(n){var k=n.parent&&byId[n.parent]?n.parent:'';(kids[k]=kids[k]||[]).push(n)});
  function go(n){
    if(calc[n.id])return calc[n.id];
    var ch=kids[n.id]||[],r;
    if(!ch.length){
      var dn=n.status==='done';
      r={p:dn?100:(n.type==='milestone'?0:n.progress),s:n.start||n.due||'',e:n.due||n.start||'',st:n.status,h:n.est||0,leaf:true,cnt:n.type==='goal'?0:1,done:dn?1:0};
    }else{
      var cs=ch.map(go),useH=cs.every(function(c){return c.h>0}),sw=0,sp=0;
      cs.forEach(function(c){var w=useH?c.h:1;sw+=w;sp+=w*c.p});
      var ss=cs.map(function(c){return c.s}).filter(Boolean).sort(),ee=cs.map(function(c){return c.e}).filter(Boolean).sort();
      r={p:Math.round(sp/sw),s:ss[0]||'',e:ee[ee.length-1]||'',st:derive(cs.map(function(c){return c.st})),h:cs.reduce(function(a,c){return a+c.h},0),leaf:false,
         cnt:cs.reduce(function(a,c){return a+c.cnt},0),done:cs.reduce(function(a,c){return a+c.done},0)};
    }
    calc[n.id]=r;return r;
  }
  S.nodes.forEach(go);
}
function kidsOf(id){return kids[id]||[]}
function isLeaf(n){return !kidsOf(n.id).length}
function isWork(n){return n.type!=='goal'&&isLeaf(n)}
function anc(n){var a=[],c=n,g=0;while(c&&g++<30){a.unshift(c);c=c.parent?byId[c.parent]:null}return a}
function goalOf(n){var a=anc(n);return a[0]&&a[0].type==='goal'?a[0]:null}
function gcol(n){var g=goalOf(n);return g?'var(--g'+((g.color%6)+1)+')':'var(--fg-3)'}
function subtree(id){var out=[],st=[id];while(st.length){var x=st.pop();out.push(x);kidsOf(x).forEach(function(c){st.push(c.id)})}return out}
function depthOf(n){return anc(n).length-1}

  if(extra&&extra.type)n.type=extra.type;

}
function upd(id,patch,act,noDrawer){
  var n=byId[id];if(!n)return;
  if(!can(n))return denied();
  var oldA=n.assignees.slice();
  Object.assign(n,patch);n.updated=Date.now();n.by=me;
  if(('start' in patch||'due' in patch)&&ui.auto)cascade(id,{});
  if('assignees' in patch){
    patch.assignees.forEach(function(u){if(oldA.indexOf(u)<0&&u!==me){logAct('назначил(а) '+uname(u)+' на «'+n.title+'»')}});
    if(patch.assignees.indexOf(me)>=0&&oldA.indexOf(me)<0)toast('Вам назначена задача «'+n.title+'»');
  }
  commit(act,noDrawer);
}
function cascade(id,seen){
  if(seen[id])return;seen[id]=1;
  var p=byId[id];var pe=p.due||p.start;if(!pe)return;
  S.nodes.forEach(function(x){
    if(x.deps.indexOf(id)<0)return;
    if(x.start&&x.start<=pe){
      var sh=diff(x.start,addD(pe,1));
      x.start=addD(x.start,sh);if(x.due)x.due=addD(x.due,sh);
      cascade(x.id,seen);
    }else if(!x.start&&x.due&&x.due<=pe){x.due=addD(pe,1);cascade(x.id,seen)}
  });
}
function shiftDates(id,d){
  var n=byId[id];if(!n||!d)return;
  var p={};if(n.start)p.start=addD(n.start,d);if(n.due)p.due=addD(n.due,d);

function retype(n){
  var p=n.parent?byId[n.parent]:null;
  if(n.type!=='milestone'&&n.type!=='goal'){n.type=!p?'task':(p.type==='goal'?'task':'subtask')}
  kidsOf(n.id).forEach(retype);
}
function moveNode(id,np,asGoal){
  var n=byId[id];if(!n)return;
  if(!can(n))return denied();
  if(np===id||(np&&subtree(id).indexOf(np)>=0)){toast('Нельзя перенести внутрь себя');return}
  n.parent=np||'';
  if(!np&&asGoal){n.type='goal'}else if(n.type==='goal'&&np){n.type='task'}
  if(!np&&!asGoal&&n.type==='goal')n.type='task';
  retype(n);
  var sib=kidsOf(np||'');n.order=Math.max(0,Math.max.apply(null,sib.map(function(x){return x.order}).concat([0])))+1;
  n.updated=Date.now();
  commit('перенёс(ла) «'+n.title+'»'+(np?' в «'+byId[np].title+'»':asGoal?' на уровень целей':' во «Входящие»'));
}
function removeNode(id){
  var n=byId[id];if(!n)return;
  if(!can(n))return denied();
  var ids=subtree(id),removed=S.nodes.filter(function(x){return ids.indexOf(x.id)>=0}).map(function(x){return JSON.parse(JSON.stringify(x))});
  var depsBackup={};
  S.nodes.forEach(function(x){if(ids.indexOf(x.id)<0&&x.deps.some(function(d){return ids.indexOf(d)>=0})){depsBackup[x.id]=x.deps.slice()}});
  S.nodes=S.nodes.filter(function(x){return ids.indexOf(x.id)<0});
  S.nodes.forEach(function(x){x.deps=x.deps.filter(function(d){return ids.indexOf(d)<0})});
  if(ui.open&&ids.indexOf(ui.open)>=0)closeDrawer();
  if(ui.mmSel&&ids.indexOf(ui.mmSel)>=0)ui.mmSel=null;
  commit('удалил(а) «'+n.title+'»'+(ids.length>1?' и ещё '+(ids.length-1):''));

    S.nodes=S.nodes.concat(removed);
    Object.keys(depsBackup).forEach(function(k){if(byId[k])byId[k].deps=depsBackup[k]});
    commit('вернул(а) «'+n.title+'»');
  },10000);
}
function setStatus(id,st){

  mm.addEventListener('touchend',function(){pinch=null});

}

var GZ=[44,22,10,4],GZN=['День','Неделя','Месяц','Квартал'],GH=34;
var gCtx={};
function critical(){
  var memo={},best={};
  function dur(n){return n.start&&n.due?diff(n.start,n.due)+1:1}
  function f(id,st){
    if(memo[id]!=null)return memo[id];var n=byId[id];if(!n||st[id])return 0;
    st[id]=1;var m=0,b=null;n.deps.forEach(function(d){var v=f(d,st);if(v>m){m=v;b=d}});st[id]=0;best[id]=b;memo[id]=m+dur(n);return memo[id];
  }
  var inv=S.nodes.filter(function(n){return n.deps.length||S.nodes.some(function(x){return x.deps.indexOf(n.id)>=0})});
  var nodes={},edges={};if(!inv.length)return {nodes:nodes,edges:edges};
  var end=null,mx=-1;inv.forEach(function(n){var v=f(n.id,{});if(v>mx){mx=v;end=n.id}});
  var cur=end;while(cur){nodes[cur]=1;var b=best[cur];if(b)edges[b+'>'+cur]=1;cur=b}
  return {nodes:nodes,edges:edges};
}

  if(ui.lane==='goal')lanes=kidsOf('').filter(function(n){return n.type==='goal'}).map(function(g){return {t:g.title,c:'var(--g'+((g.color%6)+1)+')',f:function(n){var x=goalOf(n);return x&&x.id===g.id}}}).concat([{t:'Входящие',c:'var(--fg-3)',f:function(n){return !goalOf(n)}}]);
  else if(ui.lane==='user')lanes=USERS.filter(function(u){return u.r!=='viewer'}).map(function(u){return {t:u.n,c:u.c,f:function(n){return n.assignees.indexOf(u.id)>=0}}}).concat([{t:'Не назначено',c:'var(--fg-3)',f:function(n){return !n.assignees.length}}]);
  else lanes=[{t:'',c:'',f:function(){return true}}];
  var head='<div class="b-grid" style="margin-bottom:0">'+cols.map(function(c){var k=lv.filter(function(n){return n.status===c[0]}).length;return '<div class="b-h s-'+c[0]+'"><span class="dot"></span>'+c[1]+'<span class="n">'+k+'</span></div>'}).join('')+'</div>';
  var body='<div class="b-grid">';
  lanes.forEach(function(l){
    var items=lv.filter(l.f);if(ui.lane!=='none'&&!items.length)return;
    if(l.t)body+='<div class="b-lane" style="--gc:'+l.c+'"><span class="sw"></span>'+esc(l.t)+' <span class="muted mono" style="font-weight:400;font-size:.76rem">'+items.length+'</span></div>';
    cols.forEach(function(c){body+='<div class="b-col" data-st="'+c[0]+'">'+items.filter(function(n){return n.status===c[0]}).map(card).join('')+'</div>'});
  });
  body+='</div>';
  return '<div class="g-bar-t"><span class="muted">Свимлейны:</span><div class="seg">'+[['none','Нет'],['goal','Цели'],['user','Люди']].map(function(x){return '<button type="button" data-act="lane" data-v="'+x[0]+'" class="'+(ui.lane===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div><div class="b-wrap" data-keep="board">'+head+body+'</div>';
}

/* ================= Мои задачи ================= */
function mtRow(n){
  var c=calc[n.id],done=n.status==='done';
  return '<div class="mt'+(done?' done':'')+'" style="--gc:'+gcol(n)+'"><button type="button" class="ck" data-act="tick" data-id="'+n.id+'" aria-label="'+(done?'Вернуть в работу':'Отметить выполненной')+'">'+IC.check+'</button>'+
    '<div class="body"><button type="button" class="tt" data-act="open" data-id="'+n.id+'">'+esc(n.title)+'</button>'+crumb(n)+'</div>'+
    '<div class="rt"><span>'+(c.e?dueTxt(n):'без даты')+'</span><span class="pr p-'+n.priority+'" title="'+PRL[n.priority]+'"></span></div></div>';
}
function vMine(){
  var mine=leaves().filter(function(n){return n.assignees.indexOf(me)>=0&&n.status!=='cancelled'});
  var open=mine.filter(function(n){return n.status!=='done'}),wk=addD(TODAY,7);
  var g={over:[],today:[],week:[],later:[],none:[]};
  open.forEach(function(n){var e=n.due||n.start;
    if(!e)g.none.push(n);else if(e<TODAY)g.over.push(n);else if(e===TODAY||(n.start&&n.start<=TODAY&&n.due>=TODAY))g.today.push(n);else if(e<=wk)g.week.push(n);else g.later.push(n)});
  function sort(a){return a.sort(function(x,y){return (x.due||'9').localeCompare(y.due||'9')})}
  function grp(t,a,cls){return a.length?'<div class="mg"><h3 class="'+(cls||'')+'">'+t+' <span class="chip">'+a.length+'</span></h3>'+sort(a).map(mtRow).join('')+'</div>':''}
  var u=uById(me);
  var done=mine.filter(function(n){return n.status==='done'});
  var html=grp('Просрочено',g.over,'bad')+grp('Сегодня',g.today)+grp('На неделе',g.week)+grp('Позже',g.later)+grp('Без даты',g.none)+
    (done.length?'<div class="mg"><h3>Выполнено <span class="chip">'+done.length+'</span></h3>'+done.slice(0,5).map(mtRow).join('')+'</div>':'');
  return '<div class="mine"><div style="display:flex;align-items:center;gap:10px">'+av(me)+'<div><b>'+esc(u.n)+'</b><div class="muted" style="font-size:.8rem">'+ROLE[u.r]+' · у вас открыто задач: '+open.length+'</div></div></div>'+(html||emptyV('Задач нет','Вам пока ничего не назначено.'))+'</div>';
}

/* ================= Обзор ================= */
function vDash(){
  var lv=leaves().filter(function(n){return n.type!=='milestone'&&n.status!=='cancelled'});
  var total=lv.length,done=lv.filter(function(n){return n.status==='done'}).length;
  var over=lv.filter(function(n){var e=n.due||n.start;return e&&e<TODAY&&n.status!=='done'});
  var risk=lv.filter(function(n){var e=n.due;return e&&e>=TODAY&&diff(TODAY,e)<=3&&n.status!=='done'&&n.progress<50});
  var goals=kidsOf('').filter(function(n){return n.type==='goal'});
  var allP=goals.length?Math.round(goals.reduce(function(a,g){return a+calc[g.id].p},0)/goals.length):0;
  var ms=S.nodes.filter(function(n){return n.type==='milestone'&&n.status!=='done'}).sort(function(a,b){return (a.due||'9').localeCompare(b.due||'9')});
  var h='<div class="dash">';
  h+='<div class="panel tile d3"><div class="l">Общий прогресс</div><div class="v">'+allP+'%</div><div class="s">по '+goals.length+' целям</div></div>';
  h+='<div class="panel tile d3"><div class="l">Выполнено задач</div><div class="v">'+done+'<span class="muted" style="font-size:1rem"> / '+total+'</span></div><div class="s">листовых задач и подзадач</div></div>';
  h+='<div class="panel tile d3"><div class="l">Просрочено</div><div class="v" style="color:'+(over.length?'var(--bad)':'var(--ok)')+'">'+over.length+'</div><div class="s">'+(risk.length?'ещё '+risk.length+' под риском':'рисков нет')+'</div></div>';
  h+='<div class="panel tile d3"><div class="l">Ближайшая веха</div><div class="v" style="font-size:1.2rem;line-height:1.3">'+(ms[0]?esc(ms[0].title):'—')+'</div><div class="s">'+(ms[0]&&ms[0].due?fd(ms[0].due)+' · через '+diff(TODAY,ms[0].due)+' дн.':'')+'</div></div>';
  h+='<div class="panel card-p d6"><h3>Прогресс по целям</h3>'+goals.map(function(g){var c=calc[g.id];return '<div class="gr" style="--gc:var(--g'+((g.color%6)+1)+')"><div class="nm"><span><b>'+esc(g.title)+'</b> <span class="muted">· '+c.done+' из '+c.cnt+'</span></span><div class="bar"><i style="width:'+c.p+'%"></i></div></div><div class="pc">'+c.p+'%</div></div>'}).join('')+'</div>';
  h+='<div class="panel card-p d6"><h3>План сгорания, часы</h3>'+burn(lv)+'</div>';
  h+='<div class="panel card-p d6"><h3>Нагрузка по неделям, часы (норма 40)</h3>'+loadTable(lv)+'</div>';
  h+='<div class="panel card-p d6"><h3>Просрочено и под риском</h3>'+((over.length+risk.length)?over.concat(risk).map(function(n){return '<button type="button" class="li" data-act="open" data-id="'+n.id+'"><span class="dot s-'+n.status+'"></span><span class="tx">'+esc(n.title)+'<br><span class="muted" style="font-size:.74rem">'+esc(anc(n).slice(0,-1).map(function(x){return x.title}).join(' › '))+'</span></span><span class="'+(over.indexOf(n)>=0?'over':'muted')+'">'+fd(n.due||n.start)+'</span>'+avs(n.assignees)+'</button>'}).join(''):'<div class="muted">Всё идёт по плану.</div>')+'</div>';
  h+='<div class="panel card-p d6"><h3>Вехи</h3>'+(ms.length?ms.map(function(n){return '<button type="button" class="li" data-act="open" data-id="'+n.id+'"><span>◆</span><span class="tx">'+esc(n.title)+'</span><span class="mono muted">'+fd(n.due)+'</span></button>'}).join(''):'<div class="muted">Вех нет.</div>')+'</div>';
  h+='<div class="panel card-p d6"><h3>Активность</h3><div class="act">'+S.activity.slice(0,9).map(function(a){return '<div>'+av(a.u)+'<span><b>'+esc(uname(a.u))+'</b> '+esc(a.x)+'</span><time>'+rel(a.t)+'</time></div>'}).join('')+'</div></div>';
  return h+'</div>';
}
function burn(lv){
  var tot=lv.reduce(function(a,n){return a+(n.est||0)},0);
  if(!tot)return '<div class="muted">Укажите оценку в часах, чтобы увидеть график.</div>';
  var dts=lv.map(function(n){return n.due}).filter(Boolean).concat(lv.map(function(n){return n.start}).filter(Boolean)).sort();
  var d0=dts[0],d1=dts[dts.length-1],span=Math.max(1,diff(d0,d1));
  var W=520,H=210,pl=36,pr=12,pt=14,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  function X(d){return pl+iw*clamp(diff(d0,d),0,span)/span}
  function Y(v){return pt+ih*(1-v/tot)}
  var ev={};lv.forEach(function(n){if(n.due)ev[n.due]=(ev[n.due]||0)+(n.est||0)});
  var days=Object.keys(ev).sort(),rem=tot,pts=[[d0,tot]];
  days.forEach(function(d){pts.push([d,rem]);rem-=ev[d];pts.push([d,rem])});
  var path='M'+pts.map(function(p){return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)}).join(' L');
  var left=lv.reduce(function(a,n){return a+(n.est||0)*(1-calc[n.id].p/100)},0);
  var tx=X(TODAY),ty=Y(left);
  var g='';[0,.5,1].forEach(function(f){var v=tot*f;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+Math.round(v)+'</text>'});
  [d0,addD(d0,Math.round(span/2)),d1].forEach(function(d,i){g+='<text x="'+X(d)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===2?'end':'middle')+'">'+fd(d)+'</text>'});
  return '<svg class="bd" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="План сгорания">'+g+
    '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+
    '<line x1="'+tx+'" x2="'+tx+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="var(--bad)" stroke-dasharray="3 3" opacity=".6"/>'+
    '<circle cx="'+tx+'" cy="'+ty+'" r="5" fill="var(--warn)" stroke="var(--surface)" stroke-width="2"/>'+
    '<text x="'+(tx+8)+'" y="'+(ty-8)+'" style="fill:var(--fg-2)">осталось ≈ '+Math.round(left)+' ч</text></svg>'+
    '<div class="muted" style="font-size:.74rem;margin-top:6px"><span style="color:var(--accent)">━</span> план по срокам задач · <span style="color:var(--warn)">●</span> фактический остаток сегодня</div>';
}
function loadTable(lv){
  var mon=addD(TODAY,-dow(TODAY)),weeks=[0,1,2,3];
  var res={};USERS.forEach(function(u){res[u.id]=[0,0,0,0]});
  lv.forEach(function(n){
    if(n.status==='done'||!n.est||!n.assignees.length)return;
    var rem=n.est*(1-calc[n.id].p/100)/n.assignees.length;if(rem<=0)return;
    var s=n.start||n.due||TODAY,e=n.due||s;if(s<TODAY)s=TODAY;if(e<s)e=s;
    var dur=diff(s,e)+1;
    for(var i=0;i<dur;i++){var wi=Math.floor(diff(mon,addD(s,i))/7);if(wi<0)wi=0;if(wi>3)continue;n.assignees.forEach(function(u){res[u][wi]+=rem/dur})}
  });
  var h='<div class="load"><span></span>'+weeks.map(function(w){return '<span class="hd">'+fd(addD(mon,w*7))+'</span>'}).join('');
  USERS.filter(function(u){return u.r!=='viewer'}).forEach(function(u){
    h+='<span style="display:flex;align-items:center;gap:6px">'+av(u.id)+u.s+'</span>'+res[u.id].map(function(v){var o=v>40;return '<span class="c" style="--lc:'+(o?'var(--bad)':'var(--accent)')+';--lv:'+clamp(v/40*70,0,100)+'" title="'+Math.round(v)+' ч">'+Math.round(v)+'</span>'}).join('');
  });
  return h+'</div>';
}

/* ================= Карточка задачи ================= */
function parentOptions(n){
  var bad=subtree(n.id),out=[];
  function walk(x,d){
    if(bad.indexOf(x.id)>=0||x.type==='milestone')return;
    out.push('<option value="'+x.id+'"'+(n.parent===x.id?' selected':'')+'>'+'  '.repeat(d)+esc(x.title)+'</option>');
    kidsOf(x.id).forEach(function(k){walk(k,d+1)});
  }
  kidsOf('').filter(function(x){return x.type==='goal'}).forEach(function(g){walk(g,0)});
  return '<option value=""'+(!n.parent?' selected':'')+'>Входящие (без цели)</option>'+out.join('');
}
function dependsOn(x,id,seen){seen=seen||{};if(seen[x])return false;seen[x]=1;var n=byId[x];if(!n)return false;return n.deps.some(function(d){return d===id||dependsOn(d,id,seen)})}

  }
  h+='</div><div class="dr-f"><span class="muted" style="font-size:.76rem;align-self:center">Изменено: '+esc(uname(n.by))+', '+rel(n.updated)+' назад</span>';
  if(!ro){
    var cnt=subtree(n.id).length;
    h+=ui.confirmDel===n.id?'<span style="display:flex;gap:6px"><button class="btn sm" type="button" data-act="del-no">Нет</button><button class="btn bad sm" type="button" data-act="del-yes" data-id="'+n.id+'">Удалить'+(cnt>1?' '+cnt+' элем.':'')+'</button></span>':'<button class="btn sm" type="button" data-act="del" data-id="'+n.id+'" style="color:var(--bad)">Удалить</button>';

function renderDrawer(){
  var d=$('#drawer');
  if(!ui.open||!byId[ui.open]){d.classList.remove('open');ui.open=null;return}
  var ae=document.activeElement;
  if(ae&&d.contains(ae)&&/INPUT|TEXTAREA/.test(ae.tagName)&&ae.type!=='checkbox'&&ae.type!=='range'&&ae.type!=='date')return; // не прерываем ввод
  var st=$('.dr-b',d)?$('.dr-b',d).scrollTop:0;
  d.innerHTML=drawerHTML(byId[ui.open]);d.classList.add('open');
  var b=$('.dr-b',d);if(b)b.scrollTop=st;
}
function openDrawer(id,focusTitle){
  if(!byId[id])return;ui.open=id;ui.confirmDel=null;
  var d=$('#drawer');d.innerHTML=drawerHTML(byId[id]);d.classList.add('open');
  if(focusTitle){var t=$('.dr-t',d);if(t){t.focus();t.select()}}
}
function closeDrawer(){ui.open=null;ui.confirmDel=null;$('#drawer').classList.remove('open')}

/* ================= модальные окна ================= */
function showModal(html,cls){var m=$('#modal');m.className='modal'+(cls?' '+cls:'');m.innerHTML=html;$('#scrim').classList.add('open')}
function closeModal(){$('#scrim').classList.remove('open');pal=null}
function openCreate(o){
  o=o||{};
  if(!canMake())return denied();
  var goals=kidsOf('').filter(function(n){return n.type==='goal'});
  var sel=o.parent||(goals[0]?goals[0].id:'__new');
  function walk(x,d,out){if(x.type==='milestone')return;out.push('<option value="'+x.id+'"'+(sel===x.id?' selected':'')+'>'+'  '.repeat(d)+(d?'↳ ':'')+esc(x.title)+'</option>');kidsOf(x.id).forEach(function(k){walk(k,d+1,out)})}
  var po=[];goals.forEach(function(g){walk(g,0,po)});
  showModal('<h3>'+(o.goal?'Новая цель':'Новая задача')+'</h3>'+
    '<div class="fg"><label for="c-title">Название</label><input id="c-title" placeholder="Что нужно сделать" autocomplete="off"></div>'+
    (o.goal?'':'<div class="fg"><label for="c-par">Куда добавить'+(o.cal?' (цель обязательна)':'')+'</label><select id="c-par">'+po.join('')+'<option value="__new">➕ Создать новую цель…</option><option value="">Во «Входящие» (без цели)</option></select></div>'+
    '<div class="fg" id="c-ng" hidden><label for="c-newgoal">Название новой цели</label><input id="c-newgoal" autocomplete="off"></div>'+
    '<div class="f2"><div class="fg"><label for="c-due">Срок</label><input id="c-due" type="date" value="'+(o.due||'')+'"></div><div class="fg"><label for="c-user">Исполнитель</label><select id="c-user"><option value="">Не назначен</option>'+USERS.filter(function(u){return u.r!=='viewer'}).map(function(u){return '<option value="'+u.id+'"'+(u.id===me?' selected':'')+'>'+esc(u.s)+'</option>'}).join('')+'</select></div></div>')+
    '<div class="acts"><button class="btn" type="button" data-act="mclose">Отмена</button><button class="btn pri" type="button" data-act="create-go" data-goal="'+(o.goal?1:0)+'">Создать</button></div>');
  var par=$('#c-par');if(par)par.addEventListener('change',function(){$('#c-ng').hidden=par.value!=='__new'});
  if(par&&par.value==='__new')$('#c-ng').hidden=false;
  setTimeout(function(){var t=$('#c-title');if(t)t.focus()},30);
}
function doCreate(isGoal){
  var title=$('#c-title').value.trim();
  if(!title){toast('Введите название');$('#c-title').focus();return}
  if(isGoal){
    var usedC=kidsOf('').filter(function(n){return n.type==='goal'}).length;
    addNode('',title,{type:'goal',color:usedC%6});closeModal();return;
  }
  var par=$('#c-par').value,due=$('#c-due').value,u=$('#c-user').value,pid=par;
  if(par==='__new'){
    var gt=$('#c-newgoal').value.trim();if(!gt){toast('Введите название новой цели');$('#c-newgoal').focus();return}
    var g=addNode('',gt,{type:'goal',color:kidsOf('').filter(function(n){return n.type==='goal'}).length%6});pid=g.id;
  }
  var extra={assignees:u?[u]:[]};if(due){extra.due=due;extra.start=due}
  var n=addNode(pid,title,extra);
  closeModal();if(n)toast('Задача создана','Открыть',function(){openDrawer(n.id)});
}
function confirmBox(text,ok,fn){
  showModal('<h3>Подтвердите действие</h3><p style="margin:0;color:var(--fg-2)">'+text+'</p><div class="acts"><button class="btn" type="button" data-act="mclose">Отмена</button><button class="btn bad" type="button" id="cf-ok">'+ok+'</button></div>');
  $('#cf-ok').addEventListener('click',function(){closeModal();fn()});
}
/* палитра команд */
var pal=null;
function openPalette(){
  pal={i:0,items:[]};
  showModal('<input id="p-in" placeholder="Найти задачу или команду…" autocomplete="off" aria-label="Поиск"><div class="pal-l" id="p-l"></div>','pal');
  $('#p-in').focus();palRender();
  $('#p-in').addEventListener('input',function(){pal.i=0;palRender()});
}
function palRender(){
  var q=$('#p-in').value.trim().toLowerCase(),it=[];
  VIEWS.forEach(function(v){if(!q||v[1].toLowerCase().indexOf(q)>=0)it.push({t:'Перейти: '+v[1],k:'вид',f:function(){go(v[0])}})});
  if(q&&canMake())it.push({t:'Создать задачу «'+$('#p-in').value.trim()+'»',k:'создать',f:function(){var t=$('#p-in').value.trim();closeModal();openCreate({});setTimeout(function(){$('#c-title').value=t},40)}});
  S.nodes.forEach(function(n){if(q&&n.title.toLowerCase().indexOf(q)>=0)it.push({t:n.title,k:(n.type==='goal'?'цель':n.type==='task'?'задача':'подзадача'),sub:crumb(n).replace(/<[^>]+>/g,' '),f:function(){openDrawer(n.id)}})});
  it=it.slice(0,9);pal.items=it;
  $('#p-l').innerHTML=it.length?it.map(function(x,i){return '<button type="button" class="pal-i'+(i===pal.i?' on':'')+'" data-pal="'+i+'"><span>'+esc(x.t)+'</span><span class="k">'+x.k+'</span></button>'}).join(''):'<div class="empty">Ничего не найдено</div>';
}
function palRun(i){var it=pal&&pal.items[i];if(!it)return;closeModal();it.f()}

/* ================= toast ================= */
function toast(msg,label,fn,ms){
  var t=document.createElement('div');t.className='toast';t.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button type="button">'+esc(label)+'</button>':'');
  if(label)t.querySelector('button').addEventListener('click',function(){t.remove();fn&&fn()});
  $('#toasts').appendChild(t);setTimeout(function(){t.remove()},ms||4200);
}

/* ================= навигация ================= */
function go(v){ui.view=v;ui.moreOpen=false;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}renderAll()}
function applyTheme(){var t=safe(function(){return localStorage.getItem('ep-theme')},null);if(t)document.documentElement.setAttribute('data-theme',t)}
applyTheme();

/* ================= события ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){
    var p=e.target.closest('[data-pal]');if(p){palRun(+p.dataset.pal);return}
    var mn=e.target.closest('.mm-n');
    if(mn&&!e.target.closest('button')){var id=mn.dataset.id;if(id[0]!=='_'){ui.mmSel=id;mmDraw();openDrawer(id)}else if(id==='__root'){ui.mmSel=null;mmDraw()}return}
    if(e.target.id==='scrim')closeModal();
    if(ui.moreOpen&&!e.target.closest('#more-m')){ui.moreOpen=false;$('#more-m').hidden=true}
    return;
  }
  var a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'nav':go(el.dataset.v);break;
    case 'more':ui.moreOpen=!ui.moreOpen;$('#more-m').hidden=!ui.moreOpen;e.stopPropagation();break;
    case 'open':openDrawer(id);break;
    case 'close':closeDrawer();break;
    case 'theme':var dk=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);var nt=dk?'light':'dark';document.documentElement.setAttribute('data-theme',nt);safe(function(){localStorage.setItem('ep-theme',nt)});break;
    case 'reset':confirmBox('Все данные будут заменены демонстрационными. Это действие нельзя отменить.','Сбросить',function(){S=seed();rebuild();persist();closeDrawer();renderAll();toast('Демо-данные восстановлены')});break;
    case 'palette':ui.moreOpen=false;openPalette();break;
    case 'fx':ui.fxOpen=!ui.fxOpen;$('#filters').classList.toggle('open',ui.fxOpen);break;
    case 'mine':ui.F.mine=el.dataset.v==='1';renderFilters();renderMain();break;
    case 'goalf':ui.F.goal=ui.F.goal===id?'':id;renderSide();renderFilters();if(['dash','mine'].indexOf(ui.view)>=0)go('list');else renderMain();break;
    case 'new':openCreate({parent:el.dataset.parent,due:el.dataset.due,cal:el.dataset.cal==='1'});break;
    case 'newgoal':openCreate({goal:true});break;
    case 'mclose':closeModal();break;
    case 'create-go':doCreate(el.dataset.goal==='1');break;
    case 'tog':ui.collapsed[id]=!ui.collapsed[id];renderMain();break;
    case 'mm-tog':ui.mmCol[id]=!ui.mmCol[id];mmDraw();break;
    case 'mm-all':ui.mmCol={};mmDraw();break;
    case 'mm-fit':mmFit();break;
    case 'mm-z':ui.mm.k=clamp(ui.mm.k*(el.dataset.v==='1'?1.2:.83),.3,2);mmApply();break;
    case 'mm-add':var nn=addNode(id,'Новая '+(byId[id].type==='goal'?'задача':'подзадача'));if(nn){ui.mmSel=nn.id;ui.mmCol[id]=false;mmDraw();openDrawer(nn.id,true)}break;
    case 'cal-nav':var v=+el.dataset.v;
      if(v===0)ui.calRef=ui.calMode==='month'?TODAY.slice(0,8)+'01':TODAY;
      else if(ui.calMode==='month'){var d=pd(ui.calRef);d.setMonth(d.getMonth()+v);ui.calRef=iso(d)}
      else ui.calRef=addD(ui.calRef,7*v);
      renderMain();break;
    case 'cal-mode':ui.calMode=el.dataset.v;if(ui.calMode==='month')ui.calRef=ui.calRef.slice(0,8)+'01';renderMain();break;
    case 'g-zoom':ui.gz=+el.dataset.v;ui.gDone=false;renderMain();break;
    case 'lane':ui.lane=el.dataset.v;renderMain();break;
    case 'tick':var tn=byId[id];if(tn)setStatus(id,tn.status==='done'?'todo':'done');break;
    case 'assign':var an=byId[id],as=an.assignees.slice(),ix=as.indexOf(el.dataset.u);if(ix>=0)as.splice(ix,1);else as.push(el.dataset.u);upd(id,{assignees:as},'изменил(а) исполнителей «'+an.title+'»');break;
    case 'color':upd(id,{color:+el.dataset.v},'сменил(а) цвет цели «'+byId[id].title+'»');break;
    case 'rmdep':upd(id,{deps:byId[id].deps.filter(function(d){return d!==el.dataset.dep})},'убрал(а) зависимость у «'+byId[id].title+'»');break;
    case 'comment':var ta=$('[data-cm-in="'+id+'"]');var tx=ta.value.trim();if(!tx)break;byId[id].comments.push({u:me,t:Date.now(),x:tx});var men=tx.match(/@([\p{L}]+)/gu);
      commit('оставил(а) комментарий к «'+byId[id].title+'»'+(men?' ('+men.join(', ')+')':''));break;
    case 'del':ui.confirmDel=id;renderDrawer();break;
    case 'del-no':ui.confirmDel=null;renderDrawer();break;
    case 'del-yes':ui.confirmDel=null;removeNode(id);break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='me-sel'||t.id==='me-sel2'){me=t.value;safe(function(){sessionStorage.setItem('ep-me',me)});ui.moreOpen=false;renderAll();toast('Вы работаете как '+uById(me).n+' · '+ROLE[uById(me).r]);return}
  if(t.id==='f-goal'){ui.F.goal=t.value;renderSide();renderMain();return}
  if(t.id==='f-user'){ui.F.user=t.value;renderMain();return}
  if(t.id==='f-status'){ui.F.status=t.value;renderMain();return}
  if(t.dataset.actC==='g-crit'){ui.crit=t.checked;renderMain();return}
  if(t.dataset.actC==='g-auto'){ui.auto=t.checked;toast(t.checked?'Последователи будут сдвигаться автоматически':'Автосдвиг отключён');return}
  if(t.dataset.actC==='ck'){var n=byId[t.dataset.id];var it=n.checklist[+t.dataset.i];it.d=t.checked;commit('обновил(а) чек-лист «'+n.title+'»');return}
  if(t.dataset.actS==='adddep'&&t.value){var nd=byId[t.dataset.id];upd(nd.id,{deps:nd.deps.concat([t.value])},'добавил(а) зависимость для «'+nd.title+'»');return}
  var f=t.dataset.f;if(!f)return;
  var node=byId[t.dataset.id];if(!node)return;
  var v=t.value;
  if(f==='parent'){if(v===(node.parent||''))return;moveNode(node.id,v||'',false);return}
  if(f==='status'){setStatus(node.id,v);return}
  if(f==='title'){v=v.trim();if(!v){t.value=node.title;return}upd(node.id,{title:v},'переименовал(а) «'+node.title+'» в «'+v+'»',true);return}
  if(f==='due'||f==='start'){
    var p={};p[f]=v;
    if(f==='start'&&v&&node.due&&v>node.due)p.due=v;
    if(f==='due'&&v&&node.start&&v<node.start)p.start=v;
    upd(node.id,p,'изменил(а) '+(f==='due'?'срок':'начало')+' «'+node.title+'»'+(v?' на '+fd(v):''),f!=='due'||ui.view==='list'?false:true);return;
  }
  if(f==='est'||f==='actual'){var pp={};pp[f]=Math.max(0,+v||0);upd(node.id,pp,'обновил(а) оценку «'+node.title+'»',true);return}
  if(f==='progress'){var pr=+v,ps={progress:pr};if(pr===100)ps.status='done';else if(node.status==='done')ps.status='in_progress';else if(pr>0&&(node.status==='todo'||node.status==='backlog'))ps.status='in_progress';upd(node.id,ps,'обновил(а) прогресс «'+node.title+'»: '+pr+'%');return}
  var pt={};pt[f]=v;upd(node.id,pt,'обновил(а) «'+node.title+'»',true);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='f-q'){ui.F.q=t.value;renderMain();return}
  if(t.dataset.f==='progress'){var pv=$('#d-pv');if(pv)pv.textContent=t.value+'%'}
});
document.addEventListener('keydown',function(e){
  var t=e.target,typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(pal){
    if(e.key==='ArrowDown'){e.preventDefault();pal.i=Math.min(pal.items.length-1,pal.i+1);palRender()}
    else if(e.key==='ArrowUp'){e.preventDefault();pal.i=Math.max(0,pal.i-1);palRender()}
    else if(e.key==='Enter'){e.preventDefault();palRun(pal.i)}
  }
  if(e.key==='Escape'){if($('#scrim').classList.contains('open'))closeModal();else if(ui.open)closeDrawer()}
  if(e.key==='Enter'){
    if(t.dataset.subAdd&&t.value.trim()){var par=byId[t.dataset.subAdd];var nn=addNode(par.id,t.value.trim());if(nn){var inp=$('[data-sub-add="'+par.id+'"]');inp&&inp.focus()}}
    if(t.dataset.ckAdd&&t.value.trim()){var cn=byId[t.dataset.ckAdd];cn.checklist.push({t:t.value.trim(),d:false});commit('обновил(а) чек-лист «'+cn.title+'»');var ci=$('[data-ck-add="'+cn.id+'"]');ci&&ci.focus()}
    if((t.classList.contains('kc')||t.classList.contains('mm-n'))&&!typing){t.click()}
    if(t.id==='c-title'||t.id==='c-newgoal'){var go1=$('[data-act="create-go"]');go1&&go1.click()}
  }
  if(ui.view==='map'&&ui.mmSel&&!typing&&!$('#scrim').classList.contains('open')){
    var n2=byId[ui.mmSel];if(!n2)return;
    if(e.key==='Tab'){e.preventDefault();var c=addNode(n2.id,'Новая '+(n2.type==='goal'?'задача':'подзадача'));if(c){ui.mmCol[n2.id]=false;ui.mmSel=c.id;mmDraw();openDrawer(c.id,true)}}
    else if(e.key==='Enter'){e.preventDefault();var sb=n2.parent?addNode(n2.parent,'Новая задача'):addNode('','Новая цель',{type:'goal',color:kidsOf('').length%6});if(sb){ui.mmSel=sb.id;mmDraw();openDrawer(sb.id,true)}}
    else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();var cnt=subtree(n2.id).length;if(cnt>1){confirmBox('Будет удалено элементов: <b>'+cnt+'</b> («'+esc(n2.title)+'» и всё внутри). Можно отменить в течение 10 секунд.','Удалить',function(){removeNode(n2.id)})}else removeNode(n2.id)}
    else if(e.key==='F2'){e.preventDefault();openDrawer(n2.id,true)}
  }
});

/* drag-and-drop: календарь, канбан, карта */
var dnd=null;
document.addEventListener('dragstart',function(e){
  var ev=e.target.closest('.ev'),kc=e.target.closest('.kc'),mn=e.target.closest('.mm-n');
  if(ev&&ev.dataset.id){dnd={k:'ev',id:ev.dataset.id,day:ev.dataset.day}}
  else if(kc){dnd={k:'kc',id:kc.dataset.id}}
  else if(mn&&mn.dataset.id[0]!=='_'){dnd={k:'mm',id:mn.dataset.id}}
  else return;
  try{e.dataTransfer.setData('text/plain',dnd.id);e.dataTransfer.effectAllowed='move'}catch(_){}
});
document.addEventListener('dragover',function(e){
  if(!dnd)return;
  var cell=e.target.closest('.cal-d'),col=e.target.closest('.b-col'),mn=e.target.closest('.mm-n');
  if((dnd.k==='ev'&&cell)||(dnd.k==='kc'&&col)||(dnd.k==='mm'&&mn)){e.preventDefault();
    $$('.dragover,.drop').forEach(function(x){x.classList.remove('dragover','drop')});
    (cell||col||mn).classList.add(mn?'drop':'dragover');
  }
});
document.addEventListener('dragleave',function(e){var x=e.target.closest&&e.target.closest('.cal-d,.b-col,.mm-n');if(x&&!x.contains(e.relatedTarget))x.classList.remove('dragover','drop')});
document.addEventListener('drop',function(e){
  if(!dnd)return;e.preventDefault();
  $$('.dragover,.drop').forEach(function(x){x.classList.remove('dragover','drop')});
  var d=dnd;dnd=null;
  if(d.k==='ev'){var cell=e.target.closest('.cal-d');if(cell){var dl=diff(d.day,cell.dataset.date);if(dl)shiftDates(d.id,dl)}}
  else if(d.k==='kc'){var col=e.target.closest('.b-col');if(col&&byId[d.id]&&byId[d.id].status!==col.dataset.st)setStatus(d.id,col.dataset.st)}
  else if(d.k==='mm'){
    var mn=e.target.closest('.mm-n');if(!mn)return;var tid=mn.dataset.id;
    if(tid==='__root')moveNode(d.id,'',true);
    else if(tid==='__inbox')moveNode(d.id,'',false);
    else{var tg=byId[tid];if(tg&&tg.type==='milestone'){toast('Веха не может быть родителем');return}moveNode(d.id,tid)}
  }
});
document.addEventListener('dragend',function(){dnd=null;$$('.dragover,.drop').forEach(function(x){x.classList.remove('dragover','drop')})});

/* перетаскивание полос на Ганте */
document.addEventListener('pointerdown',function(e){
  var bar=e.target.closest('.g-bar');if(!bar||bar.classList.contains('ro')||!bar.dataset.gid)return;
  var n=byId[bar.dataset.gid];if(!n||!can(n))return;
  var px=gCtx.px,x0=e.clientX,rz=!!e.target.closest('[data-rz]'),w0=bar.offsetWidth,l0=bar.offsetLeft,dd=0,moved=false;
  e.preventDefault();
  function mv(ev){
    var dx=ev.clientX-x0;if(Math.abs(dx)>3)moved=true;if(!moved)return;
    dd=Math.round(dx/px);
    if(rz){var nw=Math.max(px,w0+dd*px);bar.style.width=nw+'px';dd=Math.round((nw-w0)/px)}else bar.style.left=(l0+dd*px)+'px';
  }
  function up(){
    document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
    if(!moved){openDrawer(n.id);return}
    if(!dd){renderMain();return}
    if(rz){var nd=addD(n.due||n.start,dd);if(n.start&&nd<n.start)nd=n.start;upd(n.id,{due:nd},'изменил(а) срок «'+n.title+'» на '+fd(nd))}
    else shiftDates(n.id,dd);
  }
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
});

/* синхронизация между вкладками (realtime в рамках браузера) */
window.addEventListener('storage',function(e){
  if(e.key!==KEY||!e.newValue)return;
  var d=safe(function(){return JSON.parse(e.newValue)},null);if(!d)return;
  var prev=S.activity[0]?S.activity[0].t:0;
  S=d;rebuild();
  renderAll();
  var fresh=S.activity.filter(function(a){return a.t>prev&&a.u!==me}).slice(0,2);
  fresh.forEach(function(a){toast(uname(a.u)+' '+a.x)});
});
window.addEventListener('hashchange',function(){var h=location.hash.replace('#','');if(VIEWS.some(function(v){return v[0]===h})&&h!==ui.view){ui.view=h;renderAll()}});

/* старт */
rebuild();renderAll();
})();
